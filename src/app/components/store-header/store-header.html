<div class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="px-4 py-3">
    <!-- Branding -->
    <div class="flex items-center gap-3 mb-3">
      <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-amber-600 rounded-xl flex items-center justify-center">
        <mat-icon class="text-white">local_cafe</mat-icon>
      </div>

      <div>
        <h1 class="text-lg font-bold text-gray-900">{{ storeName }}</h1>
        <p class="text-xs text-gray-600">{{ storeTagline }}</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</mat-icon>

      <input
        type="text"
        [placeholder]="searchPlaceholder"
        [value]="searchQuery"
        (input)="updateSearchQuery($event.target.value)"
        class="w-full pl-10 pr-12 py-3 bg-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm"
      />

      <button
        type="button"
        (click)="toggleFilters()"
        class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 hover:bg-gray-200 rounded-lg transition-colors"
      >
        <mat-icon class="text-gray-600">tune</mat-icon>
      </button>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="px-4 pb-3 overflow-x-auto hide-scrollbar">
    <div class="flex gap-2">
      @for (cat of categories; track cat.id) {
        <button
          type="button"
          (click)="selectCategory(cat.id)"
          class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-colors"
          [ngClass]="
            selectedCategory === cat.id
              ? 'bg-orange-600 text-white'
              : 'bg-white text-gray-700 border border-gray-300 hover:border-orange-400'
          "
        >
          {{ cat.name }}
        </button>
      }
    </div>
  </div>
</div>
