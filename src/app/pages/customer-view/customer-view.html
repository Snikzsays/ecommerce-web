<div class="min-h-screen bg-gradient-to-b from-orange-50 to-amber-50">
  <!-- Reusable Store Header Component -->
  <app-store-header
    [storeName]="storeName"
    [storeTagline]="storeTagline"
    [searchPlaceholder]="'Search teas... (चाय खोजें)'"
    [categories]="categories"
    [searchQuery]="searchQuery"
    [selectedCategory]="selectedCategory"
    [showFilters]="showFilters"
    (searchQueryChange)="searchQuery = $event"
    (selectedCategoryChange)="selectedCategory = $event"
    (showFiltersChange)="showFilters = $event"
  ></app-store-header>
</div>
